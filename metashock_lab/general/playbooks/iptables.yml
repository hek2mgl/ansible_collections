---
- name: Configure iptables
  hosts: "s4.*"
  vars:
    iptables_rules:
      - chain: FORWARD
        policy: ACCEPT

      - chain: FORWARD
        jump: LOG_AND_DROP

      - chain: OUTPUT
        policy: ACCEPT

      - chain: OUTPUT
        jump: LOG_AND_DROP

      - chain: INPUT
        policy: ACCEPT

      - comment: Allow outgoing TCP taffic for cloudflare tunnel
        chain: OUTPUT
        destination_port: 7844
        destinations:
          - 198.41.192.7
          - 198.41.192.27
          - 198.41.192.37
          - 198.41.192.47
          - 198.41.192.57
          - 198.41.192.67
          - 198.41.192.77
          - 198.41.192.107
          - 198.41.192.167
          - 198.41.192.227
          - 198.41.200.13
          - 198.41.200.23
          - 198.41.200.33
          - 198.41.200.43
          - 198.41.200.53
          - 198.41.200.63
          - 198.41.200.73
          - 198.41.200.113
          - 198.41.200.193
          - 198.41.200.233
        cstate:
          - NEW
          - ESTABLISHED
        protocol: tcp
        jump: ACCEPT

      - comment: Allow outgoing UDP taffic for cloudflare tunnel
        chain: OUTPUT
        destination_port: 7844
        destination:
          - 198.41.192.7
        cstate:
          - NEW
          - ESTABLISHED
        protocol: udp
        jump: ACCEPT

            
          - 198.41.192.27
          - 198.41.192.37
          - 198.41.192.47
          - 198.41.192.57
          - 198.41.192.67
          - 198.41.192.77
          - 198.41.192.107
          - 198.41.192.167
          - 198.41.192.227
          - 198.41.200.13
          - 198.41.200.23
          - 198.41.200.33
          - 198.41.200.43
          - 198.41.200.53
          - 198.41.200.63
          - 198.41.200.73
          - 198.41.200.113
          - 198.41.200.193
          - 198.41.200.233


      - chain: INPUT
        jump: LOG_AND_DROP

      - chain: LOG_AND_DROP
        jump: LOG
        log_level: 6

      - chain: LOG_AND_DROP
        jump: DROP

  tasks:
    - name: Apply rules
      ansible.builtin.iptables:
        chain: "{{ item.chain }}"
        jump: "{{ item.jump | default(omit) }}"
        log_level: "{{ item.log_level| default(omit) }}"
        policy: "{{ item.policy | default(omit)}}"
        protocol: "{{ item.protocol | default(omit) }}"
      loop: "{{ iptables_rules }}"
      become: true
