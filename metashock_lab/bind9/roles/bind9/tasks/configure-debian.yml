---
- name: Create the log directory
  ansible.builtin.file:
    path: /var/log/named
    state: directory
    owner: bind
    group: bind
    mode: 0700
  become: true

- name: Render named.conf.options
  ansible.builtin.template:
    src: named.conf.options.tpl
    dest: /etc/bind/named.conf.options
    owner: bind
    group: bind
    mode: "0400"
    lstrip_blocks: true
    trim_blocks: true
  become: true
  notify:
    - Restart named.service

- name: Ensure named.service is started
  ansible.builtin.systemd:
    name: named.service
    state: started
  become: true
