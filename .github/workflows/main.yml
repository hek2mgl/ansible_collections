name: My workflow

on:
  pull_request:
    types:
      - opened
      - sychnronize
      - reopened
      - closed
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install ansible-lint
        run: pip install ansible-lint
      - name: Run ansible-lint
        run: ANSIBLE_LINT_NODEPS=1 ansible-lint metashock_lab
